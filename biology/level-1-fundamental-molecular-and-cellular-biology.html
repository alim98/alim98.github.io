<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Level 1 — Fundamental Molecular and Cellular Biology</title>
<meta name="description" content="Interactive zero-to-advanced molecular and cellular biology notebook for AI researchers entering single-cell, spatial omics, perturbation biology and glioma research.">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="biologyNotebook" src="notebook-core.html" title="Level 1 — Fundamental Molecular and Cellular Biology"></iframe>
<script>
const figures=[
  {
    section:'Compartments, membranes and organelles',
    parts:[
      'assets/fullres-q35/cell.0.txt',
      'assets/fullres-q35/cell.1.txt',
      'assets/fullres-q35/cell.2.txt',
      'assets/fullres-q35/cell.3.txt',
      'assets/fullres-q35/cell.4a.txt',
      'assets/fullres-q35/cell.4b.txt',
      'assets/fullres-q35/cell.4c.txt'
    ],
    alt:'Schematic of a eukaryotic cell showing major organelles and the secretory pathway.',
    caption:'Major organelles compartmentalize cellular functions. The inset follows a secreted protein from transcription through the rough ER, Golgi apparatus, transport vesicle and plasma membrane.'
  },
  {
    section:'From DNA to RNA',
    parts:[
      'assets/fullres-data/dogma.0.txt',
      'assets/fullres-q35/dogma.1.txt',
      'assets/fullres-q35/dogma.2.txt'
    ],
    alt:'Central dogma schematic showing gene regulation, transcription, RNA processing, export and translation.',
    caption:'DNA is transcribed into pre-mRNA, processed into mature mRNA, exported from the nucleus and translated. Enhancers, promoters and transcription factors regulate the first step.'
  },
  {
    section:'Two central growth and survival networks',
    parts:[
      'assets/fullres-q55/signal.00.txt',
      'assets/fullres-q55/signal.01.txt',
      'assets/fullres-q55/signal.02.txt'
    ],
    alt:'Schematic of the RTK RAS MAPK and PI3K AKT mTOR signaling pathways with PTEN inhibition.',
    caption:'An activated receptor tyrosine kinase can engage the RAS–MAPK and PI3K–AKT–mTOR branches. PTEN opposes signaling through the PI3K branch.'
  },
  {
    section:'Deciding whether to pause, repair or die',
    parts:[
      'assets/fullres-q55/cycle.00.txt',
      'assets/fullres-q55/cycle.01.txt',
      'assets/fullres-q55/cycle.02.txt',
      'assets/fullres-q55/cycle.03.txt',
      'assets/fullres-q55/cycle.04.txt',
      'assets/fullres-q55/cycle.05.txt',
      'assets/fullres-q55/cycle.06.txt',
      'assets/fullres-q55/cycle.07.txt',
      'assets/fullres-q55/cycle.08.txt'
    ],
    alt:'Cell-cycle schematic with G1, S, G2 and M phases and the ATM ATR p53 DNA-damage response.',
    caption:'Cyclin–CDK complexes drive cell-cycle progression, while DNA-damage checkpoints can favor arrest, repair, senescence or apoptosis.'
  }
];

async function makeSource(parts){
  const chunks=await Promise.all(parts.map(async path=>{
    const response=await fetch(path);
    if(!response.ok) throw new Error(`Could not load ${path}`);
    return (await response.text()).replace(/\s+/g,'');
  }));
  return 'data:image/webp;base64,'+chunks.join('');
}

function addStyles(doc){
  const style=doc.createElement('style');
  style.textContent=`
    .bio-figure{margin:1.45rem 0 1.2rem;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;box-shadow:0 8px 28px rgba(21,23,20,.06)}
    .bio-figure img{display:block;width:100%;height:auto;cursor:zoom-in;background:#fff}
    .bio-figure figcaption{padding:.8rem 1rem;border-top:1px solid var(--line);font-size:.78rem;line-height:1.55;color:var(--muted);background:var(--panel)}
    .bio-figure figcaption b{color:var(--ink)}
    .bio-lightbox{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:3vh 3vw;background:rgba(10,12,10,.9);cursor:zoom-out;animation:bioFade .16s ease}
    .bio-lightbox img{display:block;max-width:94vw;max-height:91vh;width:auto;height:auto;border-radius:12px;background:#fff;box-shadow:0 24px 80px rgba(0,0,0,.45)}
    .bio-lightbox button{position:fixed;right:18px;top:18px;width:38px;height:38px;border:1px solid rgba(255,255,255,.35);border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font:24px/1 system-ui;cursor:pointer}
    @keyframes bioFade{from{opacity:0}to{opacity:1}}
  `;
  doc.head.appendChild(style);
}

function openLightbox(doc,img){
  const overlay=doc.createElement('div');
  overlay.className='bio-lightbox';
  overlay.setAttribute('role','dialog');
  overlay.setAttribute('aria-label','Enlarged biology figure');
  const large=doc.createElement('img');
  large.src=img.src;
  large.alt=img.alt;
  const close=doc.createElement('button');
  close.type='button';
  close.setAttribute('aria-label','Close figure');
  close.textContent='×';
  const dismiss=()=>overlay.remove();
  overlay.addEventListener('click',dismiss);
  large.addEventListener('click',event=>event.stopPropagation());
  close.addEventListener('click',dismiss);
  doc.addEventListener('keydown',event=>{if(event.key==='Escape')dismiss()},{once:true});
  overlay.append(large,close);
  doc.body.appendChild(overlay);
}

const frame=document.getElementById('biologyNotebook');
frame.addEventListener('load',async()=>{
  const doc=frame.contentDocument;
  if(!doc)return;
  addStyles(doc);
  for(const item of figures){
    try{
      const section=[...doc.querySelectorAll('.lesson')].find(node=>node.querySelector('h2')?.textContent.trim()===item.section);
      if(!section)continue;
      const figure=doc.createElement('figure');
      figure.className='bio-figure';
      const image=doc.createElement('img');
      image.src=await makeSource(item.parts);
      image.alt=item.alt;
      image.loading='lazy';
      image.decoding='async';
      image.addEventListener('click',()=>openLightbox(doc,image));
      const caption=doc.createElement('figcaption');
      caption.innerHTML=`<b>Visual map.</b> ${item.caption} Click the figure to enlarge.`;
      figure.append(image,caption);
      const content=section.querySelector('.content')||section;
      const mastery=content.querySelector('.mastery');
      if(mastery)content.insertBefore(figure,mastery);else content.appendChild(figure);
    }catch(error){
      console.error('Figure injection failed:',item.section,error);
    }
  }
});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Level 3 — Claassen Lab Data, Tasks & Biological Reasoning</title>
<meta name="description" content="Interactive guide to the data modalities, computational tasks, statistics, and biological reasoning relevant to Manfred Claassen's single-cell and spatial systems-medicine research.">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#687066;background:#fff}
#loading{max-width:760px;margin:12vh auto;padding:2rem;font-size:1rem;line-height:1.7}
#loading b{color:#141714}
</style>
</head>
<body>
<div id="loading"><b>Loading Level 3</b><br>Claassen Lab Data, Tasks &amp; Biological Reasoning…</div>
<script>
(async()=>{
  const files=['part0.txt','part1.txt','part2.txt','part3.txt','part4.txt','part5.txt'];
  const localBase='assets/level3/';
  const rawBase='https://raw.githubusercontent.com/alim98/alim98.github.io/main/biology/assets/level3/';

  async function loadChunk(file){
    const attempts=[localBase+file,rawBase+file];
    let lastError=null;
    for(const url of attempts){
      try{
        const response=await fetch(url,{cache:'no-store'});
        if(!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        const text=await response.text();
        if(!text.trim()) throw new Error('empty response');
        return text;
      }catch(error){
        lastError=new Error(`${url}: ${error.message||error}`);
      }
    }
    throw lastError||new Error(`Could not load ${file}`);
  }

  const chunks=[];
  for(let i=0;i<files.length;i++){
    document.getElementById('loading').innerHTML=`<b>Loading Level 3</b><br>Loading notebook data ${i+1} / ${files.length}…`;
    chunks.push(await loadChunk(files[i]));
  }

  const b64=chunks.join('').replace(/\s+/g,'');
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  if(typeof DecompressionStream==='undefined'){
    throw new Error('This browser does not support DecompressionStream. Please open the page in a current Chrome, Edge, Firefox, or Safari version.');
  }
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  const parsed=new DOMParser().parseFromString(html,'text/html');
  const scripts=[...parsed.querySelectorAll('script')].map(script=>script.textContent);
  parsed.querySelectorAll('script').forEach(script=>script.remove());
  document.head.innerHTML=parsed.head.innerHTML;
  document.body.innerHTML=parsed.body.innerHTML;
  for(const code of scripts){(0,eval)(code);}
})().catch(error=>{
  console.error(error);
  document.body.innerHTML=`<div style="max-width:900px;margin:8vh auto;padding:2rem;font:14px/1.65 system-ui;color:#9a3e39"><b>Could not load notebook.</b><br><br><code style="white-space:pre-wrap;color:#5b302d">${String(error.message||error)}</code><br><br><span style="color:#687066">Hard-refresh the page once. If this message remains, the exact failed asset is shown above.</span></div>`;
});
</script>
</body>
</html>
